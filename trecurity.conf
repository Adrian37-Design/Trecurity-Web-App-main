<VirtualHost *:80>
    ServerName trecurity.com
    ServerAlias www.trecurity.com
    
    ProxyPreserveHost On
    ProxyPass / http://localhost:3002/
    ProxyPassReverse / http://localhost:3002/
    
    ErrorLog ${APACHE_LOG_DIR}/trecurity_error.log
    CustomLog ${APACHE_LOG_DIR}/trecurity_access.log combined
</VirtualHost>
